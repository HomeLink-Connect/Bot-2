name = "arntech-pilot"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
OANDA_HOST = "api-fxpractice.oanda.com"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "PASTE_YOUR_KV_NAMESPACE_ID"

# Secrets (never commit these). Set with:
#   npx wrangler secret put OANDA_TOKEN
#   npx wrangler secret put OANDA_ACCOUNT
#   npx wrangler secret put APP_KEY
